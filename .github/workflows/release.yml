# The release (ADR-0055): a pushed `v*` tag, made by `just release`. Two jobs. `release` does all
# of this, in order —
#
#   1. the tag agrees with every manifest (else nothing else runs)
#   2. every tier: unit, conformance, default e2e, the docs site build, the Custodian suite, then
#      @kind and @dist on a runner kind cluster — the installed path proven on the exact tree that
#      ships, not on a maintainer's box the day before
#   3. the Kit images, multi-arch, to their canonical home (ADR-0044)
#   4. the four packages STAGED on npm, dependencies first — live once the maintainer approves
#
# 3 before 4 is the contract: an installed kit pulls `<home>/jr2-<x>:<version>` on its first
# `jr2 up`, so a package whose images are not there fails at the user; images with no package are
# inert — and stay so while the packages sit staged.
#
# No token anywhere. GHCR takes the job's own GITHUB_TOKEN; npm takes the job's OIDC identity
# (trusted publishing, `id-token: write`), which is also the accidental-publish guard — no dev box
# can do what this job does, because nothing it holds exists outside it. And the job STAGES rather
# than publishes: each trusted publisher is configured for `npm stage publish` only ("allow npm
# publish" left unchecked), so a tag makes four staged tarballs and the maintainer's 2FA approval
# (`npm stage approve <stage-id>`, or the Staged Packages tab on npmjs.com) makes them live. A
# stolen GitHub session or a bad change to this file can stage and nothing more. Bootstrap, once:
# the very first version is published by hand with a token (npm attaches a trusted publisher only
# to a package that exists), the trusted publisher is configured on all four, and the token
# revoked.
#
# Then `pages` (ADR-0072): the docs site of the same tree, to GitHub Pages. It needs `release`, so
# a tag whose gate fails publishes no docs; it does not wait for the npm approval, which happens
# outside any job, so the site can lead the live packages by that approval. Set up once, in the
# repository's settings: Pages > Source is "GitHub Actions", and Environments > github-pages >
# Deployment branches and tags has the tag rule `v*` (by default the environment deploys from the
# default branch only, and refuses a tag).
name: kit / Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    permissions:
      contents: read
      packages: write # GHCR push
      id-token: write # npm trusted publishing
    name: Gate, push images, stage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Clone the code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Before a single dependency installs: a tag that names a version the tree does not carry
      # is a mistake to stop on, not to build past.
      - name: The tag agrees with the manifests
        run: scripts/release.sh --check "${GITHUB_REF_NAME#v}"

      - name: Setup pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json # engines.node, the one place it is written
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The @kind tier needs go (the Kit images' Go stages build in docker, but the tier's own
      # tooling and the operator do not), and both heavy tiers run through their `just` recipes so
      # this job and a maintainer's box drive one loop, not two.
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Setup just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0

      # PINNED, unlike the operator's own e2e job: this is the one workflow whose outcome cannot
      # be re-run into a different result, so a kind release that changes the node image or the
      # containerd config deploy/kind.yaml patches (ADR-0044) must not be able to make a tag
      # unpublishable, or a release from last month unreproducible.
      - name: Install kind
        env:
          KIND_VERSION: v0.33.0
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Format
        run: pnpm format:check

      - name: Unit + conformance
        run: pnpm -r --if-present test

      - name: Default e2e profile
        run: pnpm --filter @jr2/e2e test:e2e

      # The site (ADR-0072) before the irreversible line: a page that VitePress cannot compile, or
      # a dead link, stops the tag here and not in `pages`, after the packages are staged.
      - name: Docs site
        run: pnpm docs:site

      # The refusals @kind cannot see (ADR-0059): the Envoy config jr2 renders, against the pinned
      # image. The image moves only with its pin; the config moves with any release.
      - name: Custodian suite
        run: just custodian-test

      # The hosted runner starts with ~14 GB free, and the heavy tiers spend more than that: every
      # image the tiers build lands three times — in the daemon, as the tar `kind load` writes to
      # /tmp, and in the node's containerd — and the first tagged run died at exactly that point
      # (`docker save … no space left on device`, after 17 of 22 @kind scenarios). The runner
      # image ships toolchains this job never touches; deleting them frees ~25-30 GB. `df` before
      # and after, so the next disk failure is read off the log instead of guessed at.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h /

      # A VANILLA cluster (ADR-0038); both heavy tiers share it, the way the recipes say they may.
      - name: kind cluster
        run: just e2e-kind-up

      # The runner is cold and the tier is parallel: four workers' first converges built every image
      # four times over and all four timed out (v0.1.1's run). One scenario first, serially, spends
      # each build once; the recipe says why.
      - name: Warm the Kit images
        run: just e2e-kind-warm

      # TWO workers, not the profile's four: a scenario's pods ask their node for about 1.4 cpu of
      # requests (the kit-sized control pods, ADR-0060, and a 500m Sandbox), the hosted runner
      # allocates 4 and kube-system holds one, so four at once leave every Sandbox Pending on
      # `Insufficient cpu` (v0.4.0's run: 16 of 47 failed that way). The recipe has the arithmetic.
      - name: "@kind tier"
        run: just e2e-kind 2

      # The installed path: published into a local registry, installed globally, Kit images PULLED
      # (ADR-0043/0044). The only tier that executes `npm pack`, the `files:` lists, and installed
      # mode itself.
      - name: "@dist tier"
        run: just e2e-dist

      # A failed @kind scenario dumps its evidence — pod logs, the Harness's own history view with
      # the failure message verbatim, the Sandbox CRs — into this folder before its namespace goes
      # (features/steps/kind.steps.ts), and on a hosted runner the folder goes with the runner. So
      # it is kept, on failure only: the log alone says WHICH scenario failed; this says why.
      - name: Keep the @kind failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kind-failures
          path: features/.tmp/kind-failures
          if-no-files-found: ignore

      # --- everything below this line is irreversible ---

      # Multi-arch (ADR-0044): a self-host mirrors whatever the home holds, so the home holds both.
      - name: Setup QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Setup buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Staged publishing is npm >= 11.15 (Node 24 bundles an older one); the release must not
      # depend on which npm the runner image happened to ship.
      - name: npm that speaks staged publishing
        run: npm install -g npm@^11.15.0 && npm --version

      # One script, two executors (ADR-0055): the same walk a maintainer runs by hand as
      # `just publish`, here with `--stage` — the strict docs build (ADR-0072), the Kit images to
      # their home, then each public package packed and STAGED on npm, dependencies first, versions
      # already live skipped.
      - name: Push the Kit images, then stage on npm
        run: |
          scripts/publish.sh --stage
          echo "staged ${GITHUB_REF_NAME}. Approve with 2FA, dependencies first: npm stage list, then npm stage approve <stage-id>"

  # The site at https://snapwich.github.io/jr2/ (ADR-0072): VitePress over docs/site and the
  # bundle's Reference, every page also at its `.md` URL, and llms.txt. Its own job, so the Pages
  # token never sits beside the npm and GHCR identities above.
  pages:
    needs: release
    permissions:
      contents: read # the checkout
      pages: write # deploy
      id-token: write # the deployment's OIDC identity
    name: Build and deploy the docs site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Clone the code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The strict docs build first (build/site.ts), then VitePress, which fails on a dead link.
      - name: Build the site
        run: pnpm docs:site

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
