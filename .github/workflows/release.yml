# The release (ADR-0055): a pushed `v*` tag, made by `just release`. ONE job, in order —
#
#   1. the tag agrees with every manifest (else nothing else runs)
#   2. every tier: unit, conformance, default e2e, then @kind and @dist on a runner kind cluster —
#      the installed path proven on the exact tree that ships, not on a maintainer's box the day
#      before
#   3. the three Kit images, multi-arch, to their canonical home (ADR-0044)
#   4. the four packages to npm, dependencies first
#
# 3 before 4 is the contract: an installed kit pulls `<home>/jr2-<x>:<version>` on its first
# `jr2 up`, so a package whose images are not there fails at the user; images with no package are
# inert.
#
# No token anywhere. GHCR takes the job's own GITHUB_TOKEN; npm takes the job's OIDC identity
# (trusted publishing, `id-token: write`), which is also the accidental-publish guard — no dev box
# can do what this job does, because nothing it holds exists outside it. Bootstrap, once: the very
# first version is published by hand with a token (npm attaches a trusted publisher only to a
# package that exists), the trusted publisher is configured on all four, and the token revoked.
name: kit / Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    permissions:
      contents: read
      packages: write # GHCR push
      id-token: write # npm trusted publishing
    name: Gate, push images, publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Clone the code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Before a single dependency installs: a tag that names a version the tree does not carry
      # is a mistake to stop on, not to build past.
      - name: The tag agrees with the manifests
        run: scripts/release.sh --check "${GITHUB_REF_NAME#v}"

      - name: Setup pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json # engines.node, the one place it is written
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The @kind tier needs go (the Kit images' Go stages build in docker, but the tier's own
      # tooling and the operator do not), and both heavy tiers run through their `just` recipes so
      # this job and a maintainer's box drive one loop, not two.
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Setup just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0

      # PINNED, unlike the operator's own e2e job: this is the one workflow whose outcome cannot
      # be re-run into a different result, so a kind release that changes the node image or the
      # containerd config deploy/kind.yaml patches (ADR-0044) must not be able to make a tag
      # unpublishable, or a release from last month unreproducible.
      - name: Install kind
        env:
          KIND_VERSION: v0.33.0
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/$KIND_VERSION/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Format
        run: pnpm format:check

      - name: Unit + conformance
        run: pnpm -r --if-present test

      - name: Default e2e profile
        run: pnpm --filter @jr2/e2e test:e2e

      # A VANILLA cluster (ADR-0038); both heavy tiers share it, the way the recipes say they may.
      - name: kind cluster
        run: just e2e-kind-up

      - name: "@kind tier"
        run: just e2e-kind

      # The installed path: published into a local registry, installed globally, Kit images PULLED
      # (ADR-0043/0044). The only tier that executes `npm pack`, the `files:` lists, and installed
      # mode itself.
      - name: "@dist tier"
        run: just e2e-dist

      # --- everything below this line is irreversible ---

      # Multi-arch (ADR-0044): a self-host mirrors whatever the home holds, so the home holds both.
      - name: Setup QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Setup buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The canonical home is BAKED into the binary (`KIT_IMAGE_HOME`, packages/cli/src/build.ts),
      # so it is spelled here to match, not derived from the repository owner: a fork that pushed
      # to its own GHCR would ship a CLI that still pulls from this one.
      - name: Push the Kit images at their published tags
        run: just kit-push ghcr.io/snapwich

      # Packed with pnpm (which rewrites `workspace:*` to the exact version, ADR-0043) and published
      # with npm (which speaks trusted publishing). The SET is what the manifests say — every
      # `packages/*` member that is not `private` (the same rule publish.test.ts asserts) — and the
      # ORDER is pnpm's own topological walk, dependencies first, so a publish that fails half way
      # leaves packages whose own dependencies resolve; neither is written down here a second time.
      # `--provenance` because the identity is the job's; a tarball published this way carries
      # proof of the tree it came from.
      #
      # A version already on npm is SKIPPED, not failed: published versions never move, so present
      # means done — a re-run of this job after a failure past this point converges instead of
      # dying on the first 403, and the bootstrap (the first version, published by hand so a
      # trusted publisher can be attached to it) passes through here clean.
      - name: Publish to npm
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          out="$RUNNER_TEMP/tarballs"
          mkdir -p "$out"
          for dir in $(pnpm -r --workspace-concurrency=1 --filter './packages/*' exec pwd); do
            name="$(node -p "const m = require('$dir/package.json'); m.private ? '' : m.name")"
            [[ -n "$name" ]] || continue
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "$name@$ver is already on npm — skipped"
              continue
            fi
            tarball="$(pnpm -C "$dir" pack --pack-destination "$out" | tail -1)"
            npm publish "$tarball" --provenance
          done
