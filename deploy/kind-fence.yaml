# Local kind cluster for jr2 with the Fence's prerequisites (ADR-0084): `just fence-kind-up` makes it and
# `just fence-node-prep` prepares each node (Multus, the stock CNI plugins, the bridge, the rule set, the route).
# Three nodes, so that a test can put two Sandboxes of one Instance on two nodes. As in deploy/kind.yaml, nothing here
# is bound to an Instance (ADR-0019). deploy/kind.yaml (one node) stays for CI.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: jr2
networking:
  ipFamily: ipv4
nodes:
  - role: control-plane
  - role: worker
  - role: worker
# The same containerd patch as deploy/kind.yaml, for the same reason (ADR-0044): it only tells containerd that
# per-registry configuration exists, so the @dist tier can resolve its local registry.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
