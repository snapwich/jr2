# Local kind cluster for j2 (`just kind-up` / `just e2e-kind-up`). Deliberately vanilla
# (ADR-0019): nothing is baked for any instance — no mounts, no instance binding. Any cluster
# `kubectl` can reach works the same way; `j2 up` converges everything an instance needs into it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: j2
nodes:
  - role: control-plane
