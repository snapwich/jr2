# Local kind cluster for j2 — the bare, mount-less variant (`just kind-up`), fine for operator
# development. For running workspace() workflows, prefer `j2 cluster up` from an instance folder:
# it generates this config WITH the extraMounts exposing the instance's repos/ to the node
# (kind cannot add mounts to a live cluster — ADR-0009).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: j2
nodes:
  - role: control-plane
