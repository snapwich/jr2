# operator/ is a Go module, not a pnpm package — intentionally excluded.

# The scaffold pins @jr2/* at the exact KIT_VERSION (ADR-0043), so the checkout's own instances must
# resolve that literal to the local packages rather than to npm.
linkWorkspacePackages: true

packages:
  - packages/*
  # The folder `jr2 init` renders (ADR-0054): each member is a model Instance (ADR-0009) — an npm
  # package whose @jr2/* deps are the exact version the scaffold writes (ADR-0043) and resolve to
  # this checkout's packages through `linkWorkspacePackages` above. Not kit packages — they ship no
  # build of their own. `default` is the one template today; `jr2 init --template <name>` is the
  # obvious next step, hence the plural.
  - templates/*
  # System e2e acceptance suite (ADR-0010): black-box Cucumber.js specs that drive the real `jr2`
  # binary. A package so it owns its own `xstate`/cucumber deps (scaffolded instances resolve them).
  - features
  # The @kind tier's shared instance (ADR-0010): a workspace member so `jr2 up`'s image build can
  # `pnpm deploy` it; scenarios isolate by namespace, not by folder.
  - features/kind-instance
  # The @model tier's instance (ADR-0066): the same shape, a real model endpoint behind it.
  - features/model-instance
  # The docs site's hand-written pages and its navigation (ADR-0072): a member so its tests run in
  # `pnpm -r test`. Its tutorial fixture (`tutorial/greet/`) is NOT a member — its one failing test
  # is the tutorial's task, and the guard test in this package runs it.
  - docs/site
  # TEMP (chaos tests) — revert
  - tmp/chaos-instance
